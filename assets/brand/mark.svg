<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="S">
	<!-- The square lockup, drawn: the S, and the recording dot at its top right.

	     Everywhere else the logo is live text (src/components/logo.css): the
	     letter in the brand typeface with the dot beside its cap line. A browser
	     tab cannot run CSS or wait for a webfont, so here the letter is the
	     capital S of Geist SemiBold converted to an outline, and the pair — the
	     letter AND the dot, as one group — is centred on the tile.

	     The tile flips with the browser's colour scheme; the dot is the accent
	     in both, because the accent IS the brand. -->
	<style>
		.tile { fill: oklch(14.5% 0 0) }
		.glyph { fill: #fff }
		@media (prefers-color-scheme: dark) {
			.tile { fill: #fff }
			.glyph { fill: oklch(14.5% 0 0) }
		}
	</style>
	<rect class="tile" width="32" height="32" rx="8.3"/>
