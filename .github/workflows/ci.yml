name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
      - name: Lint the CSS
        run: npm run lint
      - name: Build the bundles and the docs
        run: npm run build
      # The audits read the built site, so they run after the build. Mono
      # outside the code allowlist, or a class the markup uses that no CSS
      # defines, each fail the job.
      - name: Audit
        run: npm run audit
      - run: npm run size
