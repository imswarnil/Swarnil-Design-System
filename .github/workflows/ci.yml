name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
      - name: Lint the CSS
        run: npm run lint
      - name: Build the bundles
        run: npm run build:css && npm run build:min
      # The docs are generated and no longer committed, so there is no "stale
      # docs" state to check for — the only question left is whether they still
      # build. See PRINCIPLES #10 and learn/1-start-why-design-systems-exist.md.
      - name: Build the docs
        run: npm run docs
      - name: Fail if the mono voice escaped its allowlist
        run: python3 scripts/audit-mono.py --strict
      - name: Fail on a class the markup uses but the CSS never defines
        run: python3 scripts/audit-classes.py --strict
      - run: npm run size
