<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{name} — {title}</title>
<meta name="description" content="{lead_meta}" />
<link rel="canonical" href="{canonical}" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="{name}" />
<meta property="og:title" content="{name}" />
<meta property="og:description" content="{lead_meta}" />
<meta property="og:image" content="/assets/og.png" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />

<script>
try {
  var t = localStorage.getItem('sds-theme');
  if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
} catch (e) { document.documentElement.dataset.theme = 'light'; }
</script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="/src/index.css{v}" />
<link rel="stylesheet" href="/assets/docs.css{v}" />
<link rel="stylesheet" href="/assets/home.css{v}" />
<script src="/assets/docs.js{v}" defer></script>
</head>

<body class="is-home">
<a class="skip" href="#main">Skip to content</a>

<header class="bar">
  <a class="brand" href="/">
    <span class="brand__mark" aria-hidden="true"></span>
    <span class="brand__name">Swarnil</span>
    <span class="brand__sub">Design System</span>
  </a>

  <div class="bar__end">
    <a class="barlink" href="/introduction.html">Docs</a>
    <a class="barlink" href="/principles.html">Principles</a>
    <button class="themebtn" type="button" data-theme-toggle aria-label="Switch theme">
      <span class="themebtn__dot" aria-hidden="true"></span>
      <span class="themebtn__label" data-theme-label>Light</span>
    </button>
    <a class="ghbtn" href="https://github.com/imswarnil/swarnil-design" rel="noopener">GitHub</a>
  </div>
</header>

<main id="main">
{body}
</main>

<footer class="home-foot">
  <div class="home-foot__in">
    <p class="home-foot__brand"><span class="brand__mark" aria-hidden="true"></span> Swarnil Design System</p>
    <p class="home-foot__note">Almost monochrome, so one colour can mean something.</p>
    <p class="home-foot__fine">MIT &middot; &copy; {year} Swarnil Singhai</p>
  </div>
</footer>
</body>
</html>
