<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{title} — Template — {name}</title>
<meta name="description" content="{blurb}" />
<meta name="robots" content="noindex" />
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />

<script>
try {
  var t = localStorage.getItem('sds-theme');
  if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
} catch (e) { document.documentElement.dataset.theme = 'light'; }
</script>

<link rel="preload" href="/assets/fonts/geist-variable.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="/assets/fonts.css{v}" />

<!-- The SAME stylesheet the docs run on, and the point of the whole exercise:
     a template is not a mock-up with its own CSS, it is the system arranged.
     There is no <style> block anywhere in this file or in the one it wraps. -->
<link rel="stylesheet" href="/assets/site.min.css{v}" />
<script src="/assets/nav.js{v}" defer></script>
<script src="/assets/intro.js{v}" defer></script>
</head>

<body class="tpl-body">

<!-- The strip that says you are looking at a template rather than a site.
     Excluded from print and from the page's own layout: `position: fixed`, so
     the template underneath starts at the top of the viewport exactly as it
     would in production. -->
<div class="tplbar">
  <a class="tplbar__back" href="/templates.html">
    <svg class="icon icon-sm" aria-hidden="true"><use href="/icons/sprite.svg#i-arrow-left"/></svg>
    Templates
  </a>
  <span class="tplbar__name">{title}</span>
  <span class="tplbar__uses">{uses}</span>
  <button class="tplbar__theme" type="button" data-theme-toggle aria-label="Switch theme">
    <span class="themebtn__dot" aria-hidden="true"></span>
    <span data-theme-label>Light</span>
  </button>
</div>

{body}

<script src="/assets/docs.js{v}" defer></script>
</body>
</html>
